[package]
name = "monte_hall_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1.1.0"
wasm-bindgen = "=0.2.99"
wasm-bindgen-futures = "=0.4.49"
# Multi-threading dependencies (Manual Workers)
js-sys = "0.3.76"
web-sys = { version = "0.3.76", features = ["Window", "Navigator", "Worker", "MessageEvent", "DedicatedWorkerGlobalScope"] }

